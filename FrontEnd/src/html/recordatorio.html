<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recordatorios · clinicaRamdom</title>
<link rel="stylesheet" href="/src/css/agenda.css">
<link rel="stylesheet" href="/src/css/recordatorio.css">
</head>
<body>

  <div class="app">

    <!-- ===== Sidebar (inyectado por sidebar.js) ===== -->
    <aside class="sidebar" id="sidebar-root"></aside>

    <!-- ===== Main content ===== -->
    <main class="main main--recordatorio">

      <section class="rec-hero">
        <p class="rec-eyebrow">Job automático · 24h antes</p>
        <h1 class="rec-title">
          <svg class="rec-bell" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0c0 3 1 4.5 1.5 5.5H3.5C4 12.5 5 11 5 8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 16a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Recordatorios de mañana
        </h1>
        <p class="subtitle" id="rec-fecha">{fecha de mañana}</p>
      </section>

      <section class="rec-list" id="rec-list">
        <!-- tarjetas renderizadas por recordatorio.js -->
      </section>

      <!-- 🐞 Panel de debug: muestra qué se está armando/enviando en cada acción -->
      <section class="rec-debug" id="rec-debug">
        <div class="rec-debug-head">
          <span>🐞 Debug</span>
          <button type="button" id="rec-debug-clear">Limpiar</button>
        </div>
        <div class="rec-debug-body" id="rec-debug-body"></div>
      </section>

    </main>
  </div>

  <script src="/src/js/sidebar.js"></script>
  <script src="/src/js/recordatorio.js"></script>
</body>
</html>
